name: smoke (weekly install + doctor)

# Verifies that `pip install get-class-material` from PyPI still works end-to-end:
# the package installs cleanly, Playwright Chromium downloads, and `doctor`
# reports no missing required deps. Catches upstream breakage (yt-dlp /
# playwright API changes, dependency conflicts) before users hit it.

on:
  schedule:
    - cron: "0 7 * * 1"  # every Monday 07:00 UTC (~15:00 Asia/Taipei)
  workflow_dispatch: {}  # manual trigger from the Actions tab

jobs:
  smoke:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install latest published get-class-material from PyPI
        run: pip install --upgrade get-class-material
      - name: Install Playwright Chromium
        run: python -m playwright install chromium
      - name: Run doctor (no auth-dependent checks)
        # Force UTF-8 so the ✓/⚠/✗ glyphs in doctor's output don't trip
        # Windows runners that default to cp1252. The next release will
        # set this from inside cli.py too, but PyPI's currently-published
        # 0.2.4 still needs this env override here.
        env:
          PYTHONIOENCODING: utf-8
        run: python -m ntu_cool_materials doctor
