[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "get-class-material"
version = "0.2.4"
description = "One-command bulk downloader for NTU COOL (Canvas) course materials — PDFs, lecture videos, and Pages."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "jabir", email = "jabir95tsai@gmail.com" }]
keywords = ["ntu", "ntu-cool", "canvas", "canvas-lms", "course-downloader", "education", "taiwan"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Education",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Education",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "requests>=2.31",
    "playwright>=1.45",
    "yt-dlp>=2024.1.1",
]

[project.urls]
Homepage = "https://github.com/jabir95tsai/get_class_material"
Repository = "https://github.com/jabir95tsai/get_class_material"
Issues = "https://github.com/jabir95tsai/get_class_material/issues"

[project.optional-dependencies]
dev = ["build", "twine"]

[project.scripts]
ntu-cool-materials = "ntu_cool_materials.cli:main"
ntu-cool-gcm = "ntu_cool_materials.cli:pick_main"
ntu-cool-video = "ntu_cool_materials.cool_video:main"
ntu-cool-session = "ntu_cool_materials.browser_session:main"
youtube-cookies = "ntu_cool_materials.youtube_cookies:main"

[tool.setuptools.packages.find]
include = ["ntu_cool_materials*"]
